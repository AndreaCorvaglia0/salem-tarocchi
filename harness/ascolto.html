<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Le arie, alla cieca</title>
    <style>
      @font-face { font-family: 'Fell'; src: url('./fell.woff2') format('woff2'), url('../node_modules/@fontsource/im-fell-english/files/im-fell-english-latin-400-normal.woff2') format('woff2'); font-display: swap; }
      :root { --ink:#120d17; --panel:#1d1626; --panel2:#271d33; --line:#43344f; --paper:#f0e6cf; --dim:#bdae96; --gold:#e0b95e; --gold-ink:#2a1d05; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: radial-gradient(ellipse at 50% -10%, #2f2142 0%, var(--ink) 65%) fixed; color: var(--paper); font: 19px/1.4 'Fell', Georgia, serif; -webkit-text-size-adjust: 100%; }
      button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
      main { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 14px 40px; display: flex; flex-direction: column; gap: 14px; }
      h1 { margin: 6px 0 0; font-weight: 400; font-size: 26px; }
      p { margin: 0; }
      .dim { color: var(--dim); font-size: 17px; }
      .legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .sw { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px; color: var(--dim); }
      .sw svg { width: 100%; max-width: 64px; height: 64px; border-radius: 12px; }
      .card { padding: 12px 12px 14px; border-radius: 14px; background: var(--panel); border: 1.5px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
      .card.done { border-color: #6b5a3a; }
      .head { display: flex; align-items: center; gap: 12px; }
      .head b { flex: 1; font-weight: 400; font-size: 21px; }
      .play { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--gold); background: none; position: relative; display: grid; place-items: center; font-size: 22px; color: var(--gold); }
      .play svg { position: absolute; inset: -2px; width: 60px; height: 60px; transform: rotate(-90deg); }
      .play.on { background: #e0b95e22; }
      .q { font-size: 17px; color: var(--dim); }
      .airs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .air { padding: 4px 0 6px; border-radius: 12px; border: 2px solid transparent; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; color: var(--dim); min-height: 48px; }
      .air svg { width: 100%; max-width: 52px; height: 48px; border-radius: 10px; }
      .air.on { border-color: var(--gold); color: var(--paper); }
      .likes { display: flex; gap: 8px; }
      .likes button { flex: 1; min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel2); font-size: 17px; }
      .likes button.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
      .who { display: flex; gap: 8px; align-items: center; } .who > span { flex: none; white-space: nowrap; }
      .who input { flex: 1; min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #0e0a13; color: #f3dfa6; font: 20px Georgia, serif; }
      .end { padding: 14px; border-radius: 14px; border: 1.5px dashed var(--gold); display: flex; flex-direction: column; gap: 10px; }
      .code { word-break: break-all; font: 16px/1.3 ui-monospace, Menlo, monospace; padding: 10px; border-radius: 8px; background: #0e0a13; color: #f3dfa6; user-select: all; -webkit-user-select: all; }
      .go { min-height: 52px; border-radius: 12px; border: 0; background: var(--gold); color: var(--gold-ink); font-weight: 700; }
      .count { text-align: center; }
      @keyframes rise { 0% { transform: translateY(0) scaleX(1); opacity: .0 } 15% { opacity: .9 } 100% { transform: translateY(-14px) scaleX(1.25); opacity: 0 } }
      .smoke { transform-box: fill-box; transform-origin: 50% 100%; }
      @media (prefers-reduced-motion: reduce) { .smoke { animation: none !important; } }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./ascolto.js"></script>
  </body>
</html>
