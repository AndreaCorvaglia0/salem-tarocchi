<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <base href="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>harness: sound</title>
    <style>
      html, body { margin: 0; background: #0b0d18; color: #e8e0d0; font: 15px/1.3 system-ui, sans-serif; }
      main { padding: 12px 12px 40px; max-width: 520px; margin: 0 auto; }
      h1 { font-size: 17px; margin: 4px 0 8px; } h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin: 16px 0 6px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button { font: inherit; color: inherit; background: #1d2238; border: 1px solid #3a4266; border-radius: 8px; padding: 10px 12px; min-height: 44px; }
      button.on { background: #3b3f73; border-color: #8a90d8; }
      label { display: flex; align-items: center; gap: 8px; min-height: 44px; }
      #status, #report { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; opacity: .85; }
    </style>
  </head>
  <body>
    <main>
      <h1>Suono (generato nel codice)</h1>
      <div class="row">
        <label><input type="checkbox" id="music" checked /> musica</label>
        <label><input type="checkbox" id="sfx" checked /> effetti</label>
        <button id="stop">stop</button>
      </div>
      <h2>Atmosfere</h2><div class="row" id="moods"></div>
      <label>tensione (exam) <input type="range" id="tension" min="0" max="1" step="0.05" value="0" /> <span id="tv">0</span></label>
      <h2>Effetti</h2><div class="row" id="sfxs"></div>
      <h2>Bus</h2><div class="row" id="bus"></div>
      <h2>Misura offline</h2><div class="row"><button id="measure">misura tutto</button></div>
      <div id="status"></div><div id="report"></div>
    </main>
    <script type="module" src="/harness/sound.js"></script>
  </body>
</html>
