<!doctype html>
<html lang="it"><head><meta charset="utf-8" /><base href="/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>story harness</title>
<style>
html,body{margin:0;height:100%;background:#0b0d18;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0;background:
 radial-gradient(ellipse at 50% 100%,#2b3566,transparent 60%),
 repeating-linear-gradient(90deg,#1a1f3c 0 48px,#161a34 48px 96px),#10132a}
#game i{position:absolute;bottom:34%;width:70px;height:90px;background:#2a2f55;box-shadow:inset 0 -10px #20244a}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}#ui>*{pointer-events:auto}
#log{position:fixed;top:4px;left:4px;right:4px;font:11px monospace;color:#7f8;pointer-events:none;z-index:99;max-height:80px;overflow:hidden;opacity:.8}
</style></head>
<body><div id="game"><i style="left:6%"></i><i style="left:40%;height:120px"></i><i style="right:8%"></i></div><div id="ui"></div><div id="log"></div>
<script type="module" src="/harness/story.js"></script></body></html>
