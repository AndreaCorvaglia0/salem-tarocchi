<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <base href="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <title>harness: rite</title>
    <style>
      html, body { margin: 0; height: 100%; background: #120d17; overflow: hidden; overscroll-behavior: none; }
      #ui { position: fixed; inset: 0; }
      .cmp { position: fixed; inset: 0; display: grid; gap: 4px; background: #000; }
      .cmp > div { position: relative; overflow: hidden; }
      .cmp canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cmp b { position: absolute; left: 6px; top: 6px; color: #bdae96; font: 14px Georgia, serif; z-index: 2; }
      #res { position: fixed; left: 8px; bottom: 8px; color: #6b5a48; font: 12px monospace; z-index: 100; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="res"></div>
    <script type="module" src="/harness/rite.js"></script>
  </body>
</html>
